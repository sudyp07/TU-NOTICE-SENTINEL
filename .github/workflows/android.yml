name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licences and install platform
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Test and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk TU-Notice-Sentinel.apk
          cp app/build/outputs/apk/debug/app-debug.apk TU-Notice-Sentinel-debug.apk
      - name: Upload TU Notice Sentinel APK
        uses: actions/upload-artifact@v4
        with:
          name: TU-Notice-Sentinel-debug.apk
          path: |
            android/TU-Notice-Sentinel.apk
            android/TU-Notice-Sentinel-debug.apk
          if-no-files-found: error
          retention-days: 30
