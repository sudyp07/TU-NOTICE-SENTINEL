name: TU Notice Sentinel

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "check"
        type: choice
        options:
          - check
          - test-email

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Gmail test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test-email'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node src/test-email.js

      - name: Run notice bot
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'test-email'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SOURCE_URL: "https://exam.tu.edu.np/notices"
          STATE_FILE: "data/state.json"
          DRY_RUN: "false"
          MAX_PAGES: "20"
          FIRST_RUN_LIMIT: "10"
        run: npm run bot

      - name: Commit updated state
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'test-email'
        run: |
          if git status --porcelain -- data/state.json | grep -q .; then
            echo "📝 State file changed, preparing to commit..."
            
            # 🔥 FIX: Pull latest changes first
            echo "🔄 Pulling latest changes from remote..."
            git pull origin main --rebase || git pull origin main --no-rebase
            
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            # Force add state file
            git add -f data/state.json
            
            # Check if there's anything to commit after pull
            if git status --porcelain -- data/state.json | grep -q .; then
              git commit -m "chore: update notice state [skip ci]"
              echo "🚀 Pushing changes..."
              git push origin main
              echo "✅ State update completed successfully!"
            else
              echo "✅ No changes to commit after pulling latest"
            fi
          else
            echo "✅ No state changes detected"
          fi