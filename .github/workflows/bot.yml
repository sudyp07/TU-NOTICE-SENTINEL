name: TU Notice Sentinel

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tu-notice-sentinel
  cancel-in-progress: false

jobs:
  check:
    if: ${{ vars.BOT_ENABLED != 'false' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run bot
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SOURCE_URL: ${{ vars.SOURCE_URL }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
      - name: Save state
        run: |
          if git diff --quiet -- data/state.json; then echo "No state changes."
          else
            git config user.name "TU Notice Sentinel Bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update notice state"
            git pull --rebase
            git push
          fi
