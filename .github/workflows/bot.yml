name: TU Notice Sentinel

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "check"
        type: choice
        options:
          - check
          - test-email

permissions:
  contents: write

jobs:
  sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run Gmail test
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'test-email'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: node src/test-email.js

      - name: Run notice bot
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'test-email'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SOURCE_URL: https://exam.tu.edu.np/notices
          STATE_FILE: data/state.json
          DRY_RUN: "false"
          MAX_PAGES: "20"
          FIRST_RUN_LIMIT: "10"
        run: npm start

      - name: Commit updated state
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.mode != 'test-email'
        run: |
          if git status --porcelain -- data/state.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/state.json
            git commit -m "chore: update notice state"
            git push
          else
            echo "No state changes."
          fi