name: TU Notice Sentinel
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm install
      - run: npm test
      - run: npm start
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
      - name: Save state
        run: |
          if git diff --quiet; then echo "No state changes."
          else
            git config user.name "TU Notice Sentinel Bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/state.json
            git commit -m "chore: update notice state"
            git push
          fi
